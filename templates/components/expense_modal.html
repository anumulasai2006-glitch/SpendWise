<div class="modal-overlay" id="expenseModal">

    <div class="expense-modal">

        <div class="modal-header">

            <div>
                <span class="modal-label">TRANSACTION</span>

                <h2 id="expenseModalTitle">
                    Add Expense
                </h2>

                <p id="expenseModalDescription">
                    Record your spending and keep your finances organized.
                </p>
            </div>

            <button
                class="close-modal"
                id="closeExpenseModal"
                type="button"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <form id="expenseForm">

            <div class="form-grid">

                <!-- Merchant -->
                <div class="form-group full-width">

                    <label for="merchant">
                        Merchant
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-store"></i>

                        <input
                            type="text"
                            id="merchant"
                            name="merchant"
                            placeholder="e.g. Swiggy, Amazon, KSRTC"
                            required
                        >

                    </div>

                </div>


                <!-- Amount -->
                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <div class="input-wrapper">

                        <span class="currency">₹</span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            placeholder="0.00"
                            min="1"
                            step="0.01"
                            required
                        >

                    </div>

                </div>


                <!-- Date -->
                <div class="form-group">

                    <label for="transaction_date">
                        Date
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-regular fa-calendar"></i>

                        <input
                            type="date"
                            id="transaction_date"
                            name="transaction_date"
                            required
                        >

                    </div>

                </div>


                <!-- Category -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-layer-group"></i>

                        <select
                            id="category"
                            name="category"
                            required
                        >

                            <option value="" disabled selected>
                                Select category
                            </option>

                            <option value="Food">
                                🍔 Food
                            </option>

                            <option value="Travel">
                                🚌 Travel
                            </option>

                            <option value="Shopping">
                                🛍 Shopping
                            </option>

                            <option value="Entertainment">
                                🎬 Entertainment
                            </option>

                            <option value="Bills">
                                💡 Bills
                            </option>

                            <option value="Health">
                                ❤️ Health
                            </option>

                            <option value="Education">
                                📚 Education
                            </option>

                            <option value="Other">
                                📦 Other
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Payment Method -->
                <div class="form-group">

                    <label for="payment_method">
                        Payment Method
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-credit-card"></i>

                        <select
                            id="payment_method"
                            name="payment_method"
                        >

                            <option value="UPI">
                                UPI
                            </option>

                            <option value="Card">
                                Card
                            </option>

                            <option value="Cash">
                                Cash
                            </option>

                            <option value="Net Banking">
                                Net Banking
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Notes -->
                <div class="form-group full-width">

                    <label for="notes">
                        Notes
                        <span>Optional</span>
                    </label>

                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="Add a note about this expense..."
                        rows="3"
                    ></textarea>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelExpense"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-expense-btn"
                    id="saveExpenseButton"
                >
                    <i class="fa-solid fa-check"></i>
                    Save Expense
                </button>

            </div>

        </form>

    </div>

</div>
